name: Agentic QE Quality Gate & Test Automation CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  agentic-qe-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-playwright

      - name: Install Playwright Browsers
        run: |
          playwright install --with-deps chromium

      - name: Execute Agentic Unit Tests & Quality Gates
        env:
          AI_QUALITY_GATE_THRESHOLD: 0.85
        run: |
          pytest tests/test_rag_pipeline.py -v
          pytest tests/test_langgraph_workflow.py -v
          pytest tests/test_failure_analysis.py -v
          pytest tests/test_mcp_tools.py -v

      - name: Run End-to-End Playwright Automation & Diagnostics
        run: |
          pytest tests/test_real_playwright.py -v

      - name: Archive Execution Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qe-execution-reports
          path: app/test_runner/reports/
