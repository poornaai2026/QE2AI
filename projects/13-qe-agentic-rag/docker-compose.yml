version: '3.8'

services:
  agentic-qe-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic_qe_platform
    ports:
      - "8000:8000"   # Agentic QE Dashboard & REST API
      - "8080:8080"   # Target Enterprise Web Application
      - "8001:8001"   # FastMCP Tool Protocol Server
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PINECONE_API_KEY=${PINECONE_API_KEY:-}
      - PINECONE_INDEX=${PINECONE_INDEX:-qe-enterprise-rag}
      - PLATFORM_PORT=8000
      - TARGET_APP_PORT=8080
      - MCP_SERVER_PORT=8001
      - HEADLESS_BROWSER=true
    volumes:
      - ./app/data:/app/app/data
      - ./app/test_runner/reports:/app/app/test_runner/reports
    restart: unless-stopped
