name: SlingShot QE Autonomous Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-agent:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          playwright install --with-deps chromium

      - name: Run Pytest Test Suite
        run: |
          pytest -v --tb=short

  autonomous-qe-run:
    name: Autonomous API & UI QE Validation
    needs: test-agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install -e .
          playwright install --with-deps chromium

      - name: Execute Autonomous API QE Run
        run: |
          python cli.py --type api --source swagger --input examples/sample_swagger.json --auto-approve

      - name: Execute Autonomous UI QE Run
        run: |
          python cli.py --type ui --source nlp --input "Validate landing page title and structure" --auto-approve

      - name: Upload QE Reports & Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slingshot-qe-reports
          path: |
            workspace/reports/
            workspace/tests/
